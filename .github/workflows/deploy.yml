name: Deploy Frontend (Next.js SSR)

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Inject .env File
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "${{ secrets.FRONTEND_ENV_PRODUCTION }}" > .env
          else
            echo "${{ secrets.FRONTEND_ENV_STAGING }}" > .env
          fi
          echo " .env file created for $(basename ${GITHUB_REF})"

      - name: Build Frontend
        run: npm run build

      - name: Upload Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".next,package.json,package-lock.json,public,next.config.js,.env"
          target: ${{ github.ref == 'refs/heads/main' && '/var/www/atomsuit/production/frontend' || '/var/www/atomsuit/staging/frontend' }}
          strip_components: 0

      - name: Restart Frontend App on Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              APP_DIR="/var/www/atomsuit/production/frontend"
              APP_NAME="atomsuit-production-frontend"
              PORT=3000
            else
              APP_DIR="/var/www/atomsuit/staging/frontend"
              APP_NAME="atomsuit-staging-frontend"
              PORT=3001
            fi

            echo "Deploying frontend to $APP_DIR"
            cd $APP_DIR

            echo "Installing dependencies..."
            npm ci --omit=dev

            echo "Restarting PM2 app..."
            pm2 describe "$APP_NAME" > /dev/null
            if [ $? -eq 0 ]; then
              pm2 restart "$APP_NAME"
            else
              pm2 start npm --name "$APP_NAME" -- run start -- -p $PORT
            fi

            pm2 save
            sudo systemctl reload nginx || true
            echo "Frontend deployed successfully on port $PORT"
